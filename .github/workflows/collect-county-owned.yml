name: Collect Oklahoma County county-owned properties
on:
  workflow_dispatch:
  schedule:
    - cron: '20 15 * * 1-5'
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Stage official county-owned parcels
        run: python collect_oklahoma_county_owned.py
      - name: Save dated official-source snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oklahoma-county-owned-${{ github.run_number }}
          path: output/
          retention-days: 30
          if-no-files-found: warn
