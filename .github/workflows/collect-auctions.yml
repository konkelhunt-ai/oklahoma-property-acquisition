name: Collect official Oklahoma auction records
on:
  workflow_dispatch:
  schedule:
    - cron: '17 13 * * *'
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python collector.py
      - name: Save dated public-record snapshot
        uses: actions/upload-artifact@v4
        with:
          name: creek-auctions-${{ github.run_number }}
          path: output/
          retention-days: 30
