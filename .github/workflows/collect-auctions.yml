name: Collect official Oklahoma auction records
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'collector.py'
      - 'sync_owner_queue.py'
      - 'test_owner_queue.py'
      - 'sync_investor_workflow.py'
      - 'test_investor_workflow.py'
      - '.github/workflows/collect-auctions.yml'
  schedule:
    - cron: '17 13 * * *'
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Test lead identification safeguards
        run: python -m unittest -v test_owner_queue.py test_investor_workflow.py
      - run: python -m playwright install --with-deps chromium
      - run: python collector.py
      - name: Sync to Google Sheets if configured
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            python sync_sheets.py
            python sync_owner_queue.py
            python sync_investor_workflow.py
          else
            echo "Google Sheets sync not configured yet; collector artifact remains available."
          fi
      - name: Save dated public-record snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: warn
          name: creek-auctions-${{ github.run_number }}
          path: output/
          retention-days: 30
