name: Build property enrichment queue
on:
  workflow_dispatch:
  schedule:
    - cron: '40 15 * * 1-5'
permissions:
  contents: read
jobs:
  enrich:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Build county-independent research queue
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python enrich_properties.py
